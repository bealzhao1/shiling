# 飞花令 Agent CI/CD 流水线（GitHub Actions）
# 流程：build（构建并推送镜像到 GHCR）→ deploy（部署到 Kubernetes）
#
# 前置配置（仓库 Settings → Secrets and variables → Actions → Secrets）：
#   - KUBECONFIG          ：目标 K8s 集群 kubeconfig（base64 编码后存入）
#                          生成：cat ~/.kube/config | base64 | pbcopy
#   - HY_API_KEY          ：腾讯混元 Key（默认模型，必填）
#   - DEEPSEEK_API_KEY    ：DeepSeek Key（可选）
#   - OPENAI_API_KEY      ：OpenAI Key（可选）
#   - ANTHROPIC_API_KEY   ：Claude Key（可选）
#   - MOONSHOT_API_KEY    ：Kimi Key（可选）
#   - DASHSCOPE_API_KEY   ：通义千问 Key（可选）
# 推送镜像到 GHCR 无需额外密钥，使用内置 GITHUB_TOKEN 即可。

name: Build & Deploy to Kubernetes

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 支持手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 阶段一：构建并推送镜像到 GHCR ----------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ---------- 阶段二：部署到 Kubernetes ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shiling.example.com # TODO: 改成你的真实域名
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Inject API keys as Secret
        run: |
          kubectl -n shiling create secret generic shiling-secrets \
            --from-literal=HY_API_KEY="${{ secrets.HY_API_KEY }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=MOONSHOT_API_KEY="${{ secrets.MOONSHOT_API_KEY }}" \
            --from-literal=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to cluster
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed -i "s|image: shiling:latest|image: ${IMAGE}|" deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/configmap.yaml
          kubectl apply -f deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml

      - name: Wait for rollout
        run: kubectl -n shiling rollout status deployment/shiling --timeout=180s
