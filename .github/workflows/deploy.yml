# 飞花令 Agent CI/CD 流水线（GitHub Actions）
# 打包部署方式参考 web-manager/.github/workflows/ci.yaml：
#   - 镜像构建并推送 GHCR（latest + commit SHA）
#   - kubeconfig 以原文直接写入（无需 base64 编码）
#   - deployment.yaml 使用 __IMAGE__ 占位符，由 CI 替换
#
# 前置配置（Settings → Secrets and variables → Actions → Secrets）：
#   - KUBE_CONFIG      ：目标 K8s 集群 kubeconfig（原文 YAML 直接粘贴）
#   - HY_API_KEY       ：腾讯混元 Key（默认模型，必填）
#   - DEEPSEEK_API_KEY ：DeepSeek Key（可选）
#   - OPENAI_API_KEY   ：OpenAI Key（可选）
#   - ANTHROPIC_API_KEY：Claude Key（可选）
#   - MOONSHOT_API_KEY ：Kimi Key（可选）
#   - DASHSCOPE_API_KEY：通义千问 Key（可选）
# 推送镜像到 GHCR 无需额外密钥，使用内置 GITHUB_TOKEN 即可。

name: Build & Deploy to Kubernetes

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 支持手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- 阶段一：构建并推送镜像到 GHCR ----------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------- 阶段二：部署到 Kubernetes ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # kubeconfig 以原文写入（与 web-manager/ci.yaml 一致，无需 base64）
      - name: Prepare kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          cfg="$HOME/.kube/config"
          if [ ! -s "$cfg" ]; then
            echo "Error: ~/.kube/config is empty. Check that the KUBE_CONFIG secret exists and is not base64 encoded."
            exit 1
          fi
          echo "kubeconfig size: $(wc -c < "$cfg") bytes"
          echo "cluster server(s):"
          grep -E '^\s+server:' "$cfg" | head -5

      - name: Inject API keys as Secret
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl -n shiling create secret generic shiling-secrets \
            --from-literal=HY_API_KEY="${{ secrets.HY_API_KEY }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=MOONSHOT_API_KEY="${{ secrets.MOONSHOT_API_KEY }}" \
            --from-literal=DASHSCOPE_API_KEY="${{ secrets.DASHSCOPE_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute image and apply manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed -i "s|__IMAGE__|${IMAGE}|g" deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/configmap.yaml
          kubectl apply -f deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          set +e
          kubectl -n shiling rollout status deployment/shiling --timeout=180s
          status=$?
          if [ $status -ne 0 ]; then
            echo "--- pods ---"
            kubectl -n shiling get pods -o wide
            echo "--- recent events ---"
            kubectl -n shiling get events --sort-by='.lastTimestamp'
            echo "--- deployment describe ---"
            kubectl -n shiling describe deployment/shiling
          fi
          exit $status
