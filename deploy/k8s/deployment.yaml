apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiling
  namespace: shiling
  labels:
    app.kubernetes.io/name: shiling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shiling
  template:
    metadata:
      labels:
        app: shiling
    spec:
      # 非 root 运行 + 只读根文件系统增强安全
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: shiling
          # __IMAGE__ 由 CI（deploy.yml）通过 sed 替换为 GHCR 真实镜像地址
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: shiling-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: shiling-config
