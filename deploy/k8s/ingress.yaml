apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shiling
  namespace: shiling
  labels:
    app.kubernetes.io/name: shiling
  annotations:
    # Traefik 默认支持 SSE 流式转发，无需关闭缓冲
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: shiling.bealzhao.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shiling
                port:
                  number: 80
