apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shiling
  namespace: shiling
  labels:
    app.kubernetes.io/name: shiling
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bealzhao.cn
      secretName: demo-tls-secret
  rules:
    # 如需绑定域名，取消下一行注释并填入真实域名：
    # - host: shiling.bealzhao.cn
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shiling
                port:
                  number: 80
