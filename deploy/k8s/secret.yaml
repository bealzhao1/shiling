# 注意：本文件仅为本地手工部署模板，含占位符，切勿提交真实密钥到 Git。
# 生产/流水线推荐做法：
#   1) 由 CI/CD 变量注入（见 .github/workflows/deploy.yml），或
#   2) 使用 SealedSecrets / External Secrets 等外部密钥管理。
#
# 手工部署示例：
#   kubectl -n shiling create secret generic shiling-secrets \
#     --from-literal=HY_API_KEY='sk-xxx' \
#     --from-literal=DEEPSEEK_API_KEY='sk-xxx'
#
apiVersion: v1
kind: Secret
metadata:
  name: shiling-secrets
  namespace: shiling
  labels:
    app.kubernetes.io/name: shiling
type: Opaque
stringData:
  HY_API_KEY: "REPLACE_ME"
  DEEPSEEK_API_KEY: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  MOONSHOT_API_KEY: "REPLACE_ME"
  DASHSCOPE_API_KEY: "REPLACE_ME"
