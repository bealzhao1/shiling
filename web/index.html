<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞花令 · 以诗会友</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* iOS / 移动端基础适配 */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { -webkit-tap-highlight-color: transparent; }
  input, select { font-size: 16px; } /* iOS 聚焦放大阈值；textarea 单独处理 */
  /* ============ 主题：默认「夜雨」深色 ============ */
  :root {
    --bg-1: #0b0d14;
    --bg-2: #11141d;
    --bg-grad: radial-gradient(1200px 600px at 20% -10%, #1a1d2e 0%, transparent 60%),
               radial-gradient(1000px 500px at 90% 110%, #161929 0%, transparent 55%),
               linear-gradient(180deg, #0b0d14 0%, #0a0c12 100%);
    --panel: rgba(28, 32, 44, 0.72);
    --panel-solid: #1c202c;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #e8eaf0;
    --text-dim: #9aa3b2;
    --text-faint: #6b7280;
    --accent: #a78bfa;          /* 紫，亮且不刺眼 */
    --accent-2: #7dd3fc;        /* 天青 */
    --accent-grad: linear-gradient(135deg, #a78bfa 0%, #7dd3fc 100%);
    --accent-soft: rgba(167, 139, 250, 0.18);
    --user-grad: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    --user-text: #fff;
    --tool-bg: rgba(167, 139, 250, 0.08);
    --tool-border: rgba(167, 139, 250, 0.28);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.10);
    --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.6);
    --shadow-sm: 0 2px 12px -2px rgba(0, 0, 0, 0.35);
    --radius: 18px;
    --radius-sm: 12px;
  }

  /* ============ 主题：「晴川」白底 ============ */
  :root[data-theme="light"] {
    --bg-1: #f6f7fb;
    --bg-2: #ffffff;
    --bg-grad:
      radial-gradient(900px 500px at 0% -10%, #e9e4ff 0%, transparent 55%),
      radial-gradient(800px 500px at 100% 110%, #d8ecff 0%, transparent 55%),
      linear-gradient(180deg, #fafbff 0%, #f3f5fb 100%);
    --panel: rgba(255, 255, 255, 0.78);
    --panel-solid: #ffffff;
    --border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.16);
    --text: #1f2937;
    --text-dim: #64748b;
    --text-faint: #94a3b8;
    --accent: #c1272d;          /* 朱砂红 */
    --accent-2: #c1272d;
    --accent-grad: linear-gradient(135deg, #e0464c 0%, #c1272d 100%);
    --accent-soft: rgba(193, 39, 45, 0.12);
    --user-grad: linear-gradient(135deg, #d23a40 0%, #b41e25 100%);
    --user-text: #fff;
    --tool-bg: rgba(193, 39, 45, 0.06);
    --tool-border: rgba(193, 39, 45, 0.22);
    --danger: #dc2626;
    --danger-bg: rgba(220, 38, 38, 0.08);
    --shadow: 0 10px 40px -12px rgba(15, 23, 42, 0.10);
    --shadow-sm: 0 2px 12px -2px rgba(15, 23, 42, 0.06);
  }

  /* ============ 主题：「青墨」墨绿 ============ */
  :root[data-theme="ink"] {
    --bg-1: #14201d;
    --bg-2: #0f1a17;
    --bg-grad: radial-gradient(1000px 500px at 0% -10%, #1a2b27 0%, transparent 60%),
               radial-gradient(900px 500px at 100% 110%, #0f2622 0%, transparent 55%),
               linear-gradient(180deg, #14201d 0%, #0e1816 100%);
    --panel: rgba(20, 32, 29, 0.72);
    --panel-solid: #1a2522;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --text: #e6f0ec;
    --text-dim: #93a8a1;
    --text-faint: #6c8079;
    --accent: #4ade80;          /* 竹青 */
    --accent-2: #34d399;
    --accent-grad: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
    --accent-soft: rgba(74, 222, 128, 0.18);
    --user-grad: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    --user-text: #ecfdf5;
    --tool-bg: rgba(74, 222, 128, 0.08);
    --tool-border: rgba(74, 222, 128, 0.28);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.10);
    --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    --shadow-sm: 0 2px 12px -2px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system,
                 BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  ::selection { background: var(--accent-soft); color: var(--text); }

  /* 自定义滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  ::-webkit-scrollbar-track { background: transparent; }

  .app {
    width: 100%;
    max-width: 920px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ================= 顶部栏 ================= */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 17px;
    box-shadow: 0 4px 14px var(--accent-soft);
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .brand-title {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 1.5px;
    white-space: nowrap;
  }
  .spacer { flex: 1; }

  .chip {
    background: var(--panel-solid);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .18s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .chip:active { transform: translateY(0); }
  .chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-grad);
  }
  .chip svg { width: 14px; height: 14px; }

  select.chip {
    appearance: none;
    -webkit-appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
      linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
    padding-right: 26px;
    max-width: 200px;
  }
  select.chip option { background: var(--panel-solid); color: var(--text); }

  /* ================= 欢迎区 ================= */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
  }
  .welcome {
    margin: auto;
    text-align: center;
    padding: 24px;
    max-width: 580px;
  }
  .welcome .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 76px; height: 76px;
    border-radius: 20px;
    background: var(--accent-grad);
    color: #fff;
    font-family: "Noto Serif SC", serif;
    font-size: 38px;
    font-weight: 700;
    box-shadow: 0 12px 36px var(--accent-soft);
    margin-bottom: 22px;
    transform: rotate(-3deg);
  }
  .welcome h1 {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 4px;
    color: var(--text);
    margin-bottom: 10px;
  }
  .welcome .sub {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 30px;
  }
  .welcome .sub::before,
  .welcome .sub::after {
    content: "·";
    margin: 0 10px;
    color: var(--text-faint);
  }
  .welcome .examples {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .welcome .example {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    transition: all .2s ease;
    text-align: left;
  }
  .welcome .example:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }
  .welcome .example .ico {
    width: 28px; height: 28px;
    flex-shrink: 0;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* ================= 消息 ================= */
  .row {
    display: flex;
    flex-direction: column;
    animation: msgIn .35s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .row.user      { align-items: flex-end; }
  .row.assistant { align-items: flex-start; }

  .msg-meta {
    font-size: 11px;
    color: var(--text-faint);
    margin: 0 12px 6px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-meta .avatar {
    width: 18px; height: 18px;
    border-radius: 5px;
    background: var(--accent-grad);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  .row.user .msg-meta { flex-direction: row-reverse; }

  .bubble {
    max-width: 84%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.75;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
  }
  .row.user .bubble {
    background: var(--user-grad);
    color: var(--user-text);
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 20px -6px var(--accent-soft);
  }
  .row.assistant .bubble {
    background: var(--panel-solid);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .bubble .cursor {
    display: inline-block;
    width: 7px; height: 16px;
    background: var(--accent);
    margin-left: 3px;
    vertical-align: text-bottom;
    border-radius: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* typing dots */
  .typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: typing 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30%           { transform: translateY(-4px); opacity: 1; }
  }

  /* ================= 工具调用卡片 ================= */
  .tool-call {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--tool-bg);
    border: 1px dashed var(--tool-border);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    color: var(--text-dim);
    max-width: 84%;
  }
  .tool-call .ico {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .tool-call code {
    background: rgba(0,0,0,.18);
    padding: 1px 7px;
    border-radius: 5px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11.5px;
  }
  :root[data-theme="light"] .tool-call code { background: rgba(15, 23, 42, .06); }

  /* ================= 错误条 ================= */
  .error-msg {
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    max-width: 84%;
    line-height: 1.65;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .error-msg .error-text { flex: 1; min-width: 0; word-break: break-word; }
  .error-msg .retry-btn {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background .15s ease, color .15s ease,
                transform .15s ease, box-shadow .15s ease;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: inherit;
  }
  .error-msg .retry-btn:hover {
    background: var(--danger);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
  }
  .error-msg .retry-btn:active { transform: translateY(0) scale(.97); }
  .error-msg .retry-btn:disabled {
    opacity: .65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .error-msg .retry-icon {
    display: inline-block;
    font-size: 14px;
    line-height: 1;
    transform-origin: center;
  }
  .error-msg .retry-btn.spinning .retry-icon {
    animation: retrySpin 1s linear infinite;
  }
  @keyframes retrySpin { to { transform: rotate(360deg); } }

  /* ================= 输入区 ================= */
  .composer-wrap {
    padding: 12px 24px 18px;
  }
  .composer {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 8px 8px 8px 18px;
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .25s ease,
                background-color .2s ease, transform .2s ease;
  }
  .composer:hover { border-color: var(--border-strong); }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow:
      0 0 0 4px var(--accent-soft),
      var(--shadow);
  }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 180px;
    line-height: 1.55;
    padding: 9px 0;
    letter-spacing: .15px;
  }
  textarea::placeholder { color: var(--text-faint); transition: opacity .2s ease; }
  .composer:focus-within textarea::placeholder { opacity: .6; }
  .send-btn {
    background: var(--accent-grad);
    color: #fff;
    border: none;
    border-radius: 16px;
    width: 42px; height: 42px;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px var(--accent-soft);
    transition: transform .15s ease, box-shadow .2s ease, filter .15s ease;
  }
  .send-btn:hover:not(:disabled) {
    transform: translateY(-1px) scale(1.04);
    filter: brightness(1.05);
    box-shadow: 0 8px 22px var(--accent-soft);
  }
  .send-btn:active:not(:disabled) { transform: translateY(0) scale(.96); }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }

  .footer-hint {
    text-align: center;
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 10px;
    letter-spacing: 2px;
    font-family: "Noto Serif SC", serif;
    opacity: .7;
  }

  @media (max-width: 720px) {
    .header { padding: 12px 16px; gap: 8px; }
    .brand-sub { display: none; }
    .brand-title { font-size: 15px; }
    .brand-mark { width: 30px; height: 30px; font-size: 16px; border-radius: 8px; }
    .chat { padding: 18px 16px 12px; }
    .composer-wrap { padding: 10px 16px 14px; }
    .bubble, .tool-call, .error-msg { max-width: 92%; }
    .welcome h1 { font-size: 28px; letter-spacing: 2px; }
    .welcome .examples { grid-template-columns: 1fr; }

    /* 移动端 chip 触摸区域放大（Apple HIG ≥36px） */
    .chip { min-height: 36px; }

    /* 移动端 select：iOS 忽略 appearance: none 时仍尽量紧凑 */
    select.chip {
      max-width: 140px;
      font-size: 13px;
      padding: 6px 24px 6px 12px;
    }
    select.chip option { font-size: 14px; }
  }

  /* 超小屏：iPhone SE / 360dp 安卓机 */
  @media (max-width: 420px) {
    .header { gap: 6px; padding: 10px 12px; }
    .brand { gap: 8px; }
    .brand-mark { width: 28px; height: 28px; font-size: 14px; }
    .brand-title { font-size: 14px; letter-spacing: 0; }
    select.chip {
      max-width: 100px;
      font-size: 12px;
      padding: 6px 20px 6px 10px;
    }
    /* 新对话按钮在小屏只保留图标，节省空间 */
    #newChatBtn { padding: 6px 10px; }
    #newChatBtn .btn-label { display: none; }

    .welcome h1 { font-size: 24px; letter-spacing: 1px; }
    .welcome .seal { width: 64px; height: 64px; font-size: 32px; border-radius: 16px; }
    .welcome .examples { gap: 10px; }
    .example { padding: 12px 14px; }

    .composer { padding: 10px 14px; min-height: 44px; }
    .send-btn { width: 38px; height: 38px; }
    textarea { font-size: 16px; } /* iOS 防止聚焦自动放大 */
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-mark">花</div>
      <div class="brand-text">
        <div class="brand-title">飞花令</div>
        <div class="brand-sub">以诗会友</div>
      </div>
    </div>
    <div class="spacer"></div>
    <select class="chip" id="modelSelect" title="切换模型"></select>
    <button class="chip" id="themeBtn" title="换肤" aria-label="切换主题">
      <span id="themeIcon"></span>
    </button>
    <button class="chip" id="newChatBtn" title="新对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="btn-label">新对话</span>
    </button>
  </header>

  <main class="chat" id="chat"></main>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="问我一句诗、行一道令、接一首龙…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12l14-7-5 7 5 7z"/>
        </svg>
      </button>
    </div>
    <div class="footer-hint">学而时习之 · 不亦说乎</div>
  </div>
</div>

<script>
(function () {
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const modelSelect = document.getElementById('modelSelect');
  const newChatBtn = document.getElementById('newChatBtn');
  const themeBtn = document.getElementById('themeBtn');
  const themeIcon = document.getElementById('themeIcon');

  // SVG 主题图标
  const ICONS = {
    dark:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
    ink:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M2 22c4-2 7-2 10 0s6 2 10 0"/><path d="M12 2v18"/><path d="M5 7c2 2 5 2 7 0s5-2 7 0"/><path d="M5 12c2 2 5 2 7 0s5-2 7 0"/></svg>'
  };

  // ---- 主题 ----
  const THEMES = [
    { key: 'dark',  name: '夜雨' },
    { key: 'light', name: '晴川' },
    { key: 'ink',   name: '青墨' },
  ];
  const AUTO_KEY = '__auto__';

  function autoThemeByTime() {
    const h = new Date().getHours();
    if (h >= 6 && h < 17) return 'light';
    if (h >= 17 && h < 19) return 'ink';
    return 'dark';
  }

  function applyTheme(key) {
    const isAuto = (key == null) || key === AUTO_KEY;
    const actualKey = isAuto ? autoThemeByTime() : key;
    const t = THEMES.find(x => x.key === actualKey) || THEMES[0];
    document.documentElement.setAttribute('data-theme', t.key);
    try {
      if (isAuto) localStorage.removeItem('fh_theme');
      else localStorage.setItem('fh_theme', t.key);
    } catch (_) {}
    if (themeBtn && themeIcon) {
      const mode = isAuto ? '自动' : '手动';
      themeBtn.title = mode + ' · ' + t.name + '（点击循环）';
      themeIcon.innerHTML = ICONS[t.key] || ICONS.dark;
    }
  }

  function currentThemeKey() {
    let v = null;
    try { v = localStorage.getItem('fh_theme'); } catch (_) {}
    return (v && THEMES.some(x => x.key === v)) ? v : AUTO_KEY;
  }

  function cycleTheme() {
    const cur = currentThemeKey();
    const curIdx = (cur === AUTO_KEY) ? -1 : THEMES.findIndex(x => x.key === cur);
    const nextKey = (curIdx + 1 >= THEMES.length) ? AUTO_KEY : THEMES[curIdx + 1].key;
    applyTheme(nextKey);
  }

  if (themeBtn) themeBtn.addEventListener('click', cycleTheme);
  applyTheme(currentThemeKey());
  setInterval(() => {
    if (currentThemeKey() === AUTO_KEY) applyTheme(AUTO_KEY);
  }, 60 * 1000);

  // ---- 状态 ----
  let sessionId = localStorage.getItem('fh_session_id') || '';
  let currentModel = '';
  let busy = false;
  let lastUserPrompt = '';

  // ---- 模型列表 ----
  async function loadModels() {
    try {
      const resp = await fetch('/api/models');
      const data = await resp.json();
      const defaultModel = data.default;
      currentModel = defaultModel;
      const models = data.models || {};
      modelSelect.innerHTML = '';
      for (const [key, m] of Object.entries(models)) {
        const opt = document.createElement('option');
        opt.value = key;
        const desc = (m.description || m.model).replace(/[（(]默认[)）]?/g, '').trim();
        opt.textContent = desc;
        opt.title = `${key} → ${m.model}`;
        if (key === defaultModel) opt.selected = true;
        modelSelect.appendChild(opt);
      }
    } catch (e) {
      console.error('加载模型列表失败', e);
    }
  }

  // ---- 欢迎区 ----
  function renderWelcome() {
    chatEl.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.innerHTML = `
      <div class="seal">花</div>
      <h1>飞花令</h1>
      <div class="sub">以 诗 会 友</div>
      <div class="examples">
        <div class="example" data-q="以“月”行飞花令"><span class="ico">🌙</span>以“月”行飞花令</div>
        <div class="example" data-q="接龙“床前明月光”"><span class="ico">🐉</span>接龙“床前明月光”</div>
        <div class="example" data-q="写一句思乡的诗"><span class="ico">🍂</span>写一句思乡的诗</div>
        <div class="example" data-q="解读“举头望明月，低头思故乡”"><span class="ico">📜</span>解读名句</div>
      </div>`;
    chatEl.appendChild(w);
  }

  function appendUser(text) {
    lastUserPrompt = text;
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="msg-meta"><span class="avatar">你</span></div><div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    chatEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function appendAssistant() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.innerHTML = `<div class="msg-meta"><span class="avatar">花</span>飞花令</div><div class="bubble"></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    return { row, bubble: row.querySelector('.bubble') };
  }

  function appendToolCall(name, args) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const div = document.createElement('div');
    div.className = 'tool-call';
    let argsShort = '';
    try { argsShort = JSON.stringify(JSON.parse(args)); } catch (e) { argsShort = args; }
    if (argsShort.length > 60) argsShort = argsShort.slice(0, 60) + '…';
    div.innerHTML = `<span class="ico">⚙</span> 检索诗词 <code>${escapeHtml(name)}</code>${argsShort ? ` <code>${escapeHtml(argsShort)}</code>` : ''}`;
    row.appendChild(div);
    chatEl.appendChild(row);
    scrollBottom();
  }

  function appendError(msg) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const div = document.createElement('div');
    div.className = 'error-msg';
    const textEl = document.createElement('span');
    textEl.className = 'error-text';
    textEl.textContent = '⚠️ ' + msg;
    div.appendChild(textEl);
    if (lastUserPrompt) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'retry-btn';
      btn.title = '自动重发上一条提示';
      btn.innerHTML = '<span class="retry-icon">↻</span><span class="retry-label">重试</span>';
      btn.addEventListener('click', () => retryLast(btn));
      div.appendChild(btn);
    }
    row.appendChild(div);
    chatEl.appendChild(row);
    scrollBottom();
    return { row, div };
  }

  function scrollBottom() {
    requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
  }
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---- SSE ----
  function parseSSEBlock(block) {
    let event = 'message';
    const dataLines = [];
    for (const line of block.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
    }
    if (dataLines.length === 0) return null;
    let data;
    try { data = JSON.parse(dataLines.join('\n')); } catch (e) { data = {}; }
    return { event, data };
  }

  // ---- 流式对话 ----
  async function streamChat(text, bubble) {
    // typing 指示
    const typing = document.createElement('span');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    bubble.appendChild(typing);

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId, model: currentModel })
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let receivedAnyDelta = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const msg = parseSSEBlock(block);
          if (!msg) continue;

          switch (msg.event) {
            case 'meta':
              sessionId = msg.data.session_id || sessionId;
              try { localStorage.setItem('fh_session_id', sessionId); } catch (_) {}
              break;
            case 'delta':
              if (!receivedAnyDelta) {
                typing.remove();
                receivedAnyDelta = true;
              }
              bubble.appendChild(document.createTextNode(msg.data.content || ''));
              scrollBottom();
              break;
            case 'tool_call':
              appendToolCall(msg.data.name, msg.data.arguments);
              break;
            case 'error':
              typing.remove();
              appendError(msg.data.message || '未知错误');
              break;
            case 'done':
            case 'close':
              break;
          }
        }
      }
      if (typing.isConnected) typing.remove();
    } catch (e) {
      if (typing.isConnected) typing.remove();
      appendError('请求失败：' + e.message + '（请确认服务端已启动、API Key 已配置）');
    }
  }

  // ---- 发送 ----
  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    autoResize();
    if (chatEl.querySelector('.welcome')) chatEl.innerHTML = '';

    appendUser(text);
    const { bubble } = appendAssistant();
    try {
      await streamChat(text, bubble);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function retryLast(btn) {
    if (busy || !lastUserPrompt) return;
    if (btn) {
      btn.disabled = true;
      btn.classList.add('spinning');
    }
    chatEl.querySelectorAll('.error-msg').forEach(el => {
      const row = el.parentNode;
      if (row && row.parentNode) row.remove();
    });
    busy = true;
    sendBtn.disabled = true;
    const { bubble } = appendAssistant();
    try {
      await streamChat(lastUserPrompt, bubble);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // ---- 事件 ----
  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener('input', autoResize);
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }
  modelSelect.addEventListener('change', () => { currentModel = modelSelect.value; });

  newChatBtn.addEventListener('click', async () => {
    if (sessionId) {
      try {
        await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
      } catch (e) {}
    }
    sessionId = '';
    try { localStorage.removeItem('fh_session_id'); } catch (_) {}
    renderWelcome();
  });

  // 欢迎区示例点击
  chatEl.addEventListener('click', (e) => {
    const ex = e.target.closest('.example');
    if (ex && ex.dataset.q) {
      inputEl.value = ex.dataset.q;
      send();
    }
  });

  loadModels();
  renderWelcome();
})();
</script>
</body>
</html>
